[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uso"
version = "0.1.0"
description = "Unified Script Orchestrator — centralized, secure, observable script management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "apscheduler>=3.11.0",
    "fastmcp>=3.0.0",
    # Python automation / utility libraries available out-of-the-box
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0.0",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
uso = "uso.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uso"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
