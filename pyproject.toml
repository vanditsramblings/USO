[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uso"
version = "0.1.0"
description = "Unified Script Orchestrator — centralized, secure, observable script management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.45.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "apscheduler>=3.11.0",
    "fastmcp>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0",
    "httpx>=0.28.0",
]

[project.scripts]
uso = "uso.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uso"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
